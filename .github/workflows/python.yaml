name: Lint and test

on:
  push:
    branches:
      - main
  pull_request:

env:
  UV_VERSION: 0.12.5

jobs:
  lint:
    name: Lint and format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # ruff only needs the dev group, so the main dependencies (psycopg2 needs
      # to be compiled) are not installed here
      - name: Install dev dependencies
        run: uv sync --locked --only-dev

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check --diff .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libpq (required to build psycopg2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Django checks
        env:
          DJANGO_SETTINGS_MODULE: mysite.settings_test
        run: |
          uv run --no-sync python manage.py check
          uv run --no-sync python manage.py makemigrations --check --dry-run

      - name: pytest
        run: uv run --no-sync pytest --cov --cov-report=term-missing
