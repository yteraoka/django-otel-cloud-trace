name: Lint and test

on:
  push:
    branches:
      - main
  pull_request:

env:
  POETRY_VERSION: 2.4.1

jobs:
  lint:
    name: Lint and format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: poetry

      - name: Install dev dependencies
        run: poetry install --only dev --no-interaction --no-ansi

      - name: ruff check
        run: poetry run ruff check --output-format=github .

      - name: ruff format --check
        run: poetry run ruff format --check --diff .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Install libpq (required to build psycopg2)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Django checks
        env:
          DJANGO_SETTINGS_MODULE: mysite.settings_test
        run: |
          poetry run python manage.py check
          poetry run python manage.py makemigrations --check --dry-run

      - name: pytest
        run: poetry run pytest --cov --cov-report=term-missing
