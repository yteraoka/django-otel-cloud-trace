[project]
name = "django-otel-cloud-trace"
version = "0.1.0"
description = "Django tutorial app instrumented with OpenTelemetry for Cloud Trace"
authors = [{ name = "Yoshinori Teraoka", email = "teraoka@3-shake.com" }]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "django (>=6.1,<7.0)",
    "opentelemetry-instrumentation-django (>=0.65b0,<0.66)",
    "opentelemetry-exporter-gcp-trace (>=1.15.0,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "opentelemetry-instrumentation-psycopg2 (>=0.65b0,<0.66)",
    "opentelemetry-instrumentation-requests (>=0.65b0,<0.66)",
    "daphne (>=4.2.3,<5.0.0)",
    "opentelemetry-propagator-gcp (>=1.15.0,<2.0.0)",
    "opentelemetry-instrumentation-asgi (>=0.65b0,<0.66)",
    "opentelemetry-resourcedetector-gcp (>=1.14.0,<2.0.0)",
]

# [build-system] is intentionally absent: this is an application, not a library,
# so uv treats it as a virtual project and does not install it into the venv.

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.4,<0.17.0)",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mysite.settings_test"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["mysite", "polls"]
omit = ["*/migrations/*", "*/tests/*", "*/tests.py", "*/test_*.py", "mysite/settings_test.py"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["polls/migrations"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "DJ",  # flake8-django
  "SIM", # flake8-simplify
  "RUF", # ruff specific rules
]

[tool.ruff.lint.per-file-ignores]
"mysite/settings_test.py" = ["F403", "F405"]
